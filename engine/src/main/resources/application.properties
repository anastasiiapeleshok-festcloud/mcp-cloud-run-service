# Different default port than adk-mcp-sandbox's engine (8081) on purpose — lets you run
# both variants side by side on the same machine for a direct [TIMING] comparison.
server.port=8082
logging.level.ai.festcloud.adkpoc=INFO
logging.level.com.google.adk.plugins.LoggingPlugin=INFO

# --- Real Cloud Run Service (not Job, not local Docker) ---
# The Service's own https URL, e.g. https://mcp-sandbox-service-xxxxx-ez.a.run.app
# (no trailing slash). This IS the only network address Engine needs — no broker,
# no ngrok tunnel, no public endpoint required on Engine's own side, because the
# Service accepts inbound calls directly.
#
# NOTE: plain ${VAR} with no default — if SANDBOX_SERVICE_URL isn't exported, Spring
# fails FAST at startup with "Could not resolve placeholder 'SANDBOX_SERVICE_URL'".
# (A previous version used the bash idiom ${VAR:?message} here, which doesn't mean
# "required" to Spring — Spring reads everything after ':' as a literal DEFAULT VALUE,
# so a missing env var silently became the literal string "?export ... before running",
# which only broke later as a confusing URISyntaxException at request time. Don't
# reintroduce that pattern.)
sandbox.service-url=${SANDBOX_SERVICE_URL}

# Set to true once the Service is deployed with --no-allow-unauthenticated and you've
# run 'gcloud auth application-default login' + granted your ADC principal run.invoker
# on it (see README step 2b). Left false for the very first smoke test against a
# --allow-unauthenticated Service.
sandbox.require-auth-token=${SANDBOX_REQUIRE_AUTH:false}

# --- Which MCP server DynamicAgentFactory spawns per chat request ---
# "operaton" (default) = real npx operaton-mcp, using the OPERATON_* vars below.
# "demo"              = public, credential-free npx @modelcontextprotocol/server-everything
#                        — no Operaton network/credentials needed at all in this mode.
# Tools are discovered live either way (see DynamicAgentFactory/SandboxSessionManager),
# so switching this is the ONLY thing you need to change — no tool declarations to sync.
mcp.server=${MCP_SERVER:operaton}

# --- Operaton connection — only actually read when mcp.server=operaton ---
# Defaulted to empty (not a hard-required placeholder) so MCP_SERVER=demo works without
# ever setting these; if you run in operaton mode without them, operaton-mcp itself will
# fail at sandbox start with a clear "no configuration found" error instead.
operaton.base-url=${OPERATON_BASE_URL:}
operaton.username=${OPERATON_USERNAME:}
operaton.password=${OPERATON_PASSWORD:}

# --- Gemini API key mode (chosen over Vertex AI) ---
# google-genai's default Client picks this up from the environment automatically —
# nothing to configure here, just: export GOOGLE_API_KEY=... before running.
